{% extends 'shop/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">✓</div>
    <h2 class="text-2xl font-bold mb-2">Pesanan Berhasil Dibuat!</h2>
    <p class="text-gray-500 mb-6">Terima kasih <strong>{{ order.full_name }}</strong>. Nomor Pesanan Anda: <strong>#ORD-{{ order.id }}</strong></p>
    
    {% if snap_token %}
    <!-- Tombol Panggil Pembayaran Midtrans Snap -->
    <button id="pay-button" class="w-full bg-emerald-600 text-white font-semibold py-3 px-6 rounded-xl hover:bg-emerald-700 transition-colors mb-4 shadow-sm">
        Bayar Sekarang (QRIS / Transfer)
    </button>
    
    <!-- Midtrans Snap Script JS -->
    <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="{{ midtrans_client_key }}"></script>
    <script type="text/javascript">
      document.getElementById('pay-button').onclick = function () {
        snap.pay('{{ snap_token }}', {
          onSuccess: function(result) {
            alert("Pembayaran Berhasil!");
            window.location.href = '{% url "order_history" %}';
          },
          onPending: function(result) {
            alert("Menunggu Pembayaran!");
            window.location.href = '{% url "order_history" %}';
          },
          onError: function(result) {
            alert("Pembayaran Gagal!");
          }
        });
      };
    </script>
    {% endif %}

    <a href="{% url 'product_list' %}" class="block text-sm text-indigo-600 hover:underline mt-4">Kembali ke Katalog</a>
</div>
{% endblock %}
